<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read Aloud – 2단계 사진 인식</title>
<style>
  :root {
    --bg: #fffaf0;
    --card: #ffffff;
    --text: #222;
    --muted: #666;
    --primary: #2e7d32;
    --danger: #c62828;
    --camera: #1565c0;
    --border: #ddd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 220px;
    font-family: inherit;
    font-size: 20px;
    line-height: 1.5;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    resize: vertical;
  }
  select {
    width: 100%;
    font-size: 18px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #fff;
  }
  .buttons { display: flex; gap: 12px; }
  .big-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    padding: 22px 0;
    border: none;
    border-radius: 18px;
    color: #fff;
    cursor: pointer;
    text-align: center;
    touch-action: manipulation; /* 더블탭 확대 방지 */
    user-select: none;
    -webkit-user-select: none;
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn.disabled { opacity: 0.4; pointer-events: none; }
  #btnSpeak  { background: var(--primary); }
  #btnStop   { background: var(--danger); }
  .camera-btn { background: var(--camera); }
  .album-btn  { background: #fff; color: var(--camera); border: 2px solid var(--camera); font-size: 18px; flex: 0 0 34%; }
  input[type=file] { display: none; }
  #preview {
    display: none;
    width: 100%;
    max-height: 240px;
    object-fit: contain;
    margin-top: 12px;
    border-radius: 12px;
    background: #eee;
  }
  progress { width: 100%; height: 14px; margin-top: 12px; display: none; }
  input[type=range] { width: 100%; height: 36px; }
  .rate-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
  #rateValue { font-size: 22px; font-weight: 700; color: var(--text); }
  .status { font-size: 16px; color: var(--muted); margin-top: 12px; }
  #log {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
    background: #f4f4f4;
    padding: 8px;
    border-radius: 8px;
  }
  details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>📖 Read Aloud</h1>

  <!-- ===== 사진 찍기 ===== -->
  <div class="card">
    <div class="buttons">
      <!-- label을 누르면 숨겨진 파일 입력이 열림 -->
      <label class="big-btn camera-btn" id="lblCamera" for="fileCamera">📷 사진 찍기</label>
      <label class="big-btn album-btn"  id="lblAlbum"  for="fileAlbum">🖼 앨범</label>
    </div>
    <input id="fileCamera" type="file" accept="image/*" capture="environment">
    <input id="fileAlbum"  type="file" accept="image/*">
    <progress id="ocrProgress" max="100" value="0"></progress>
    <div class="status" id="ocrStatus">책 페이지를 찍어 주세요.</div>
    <img id="preview" alt="찍은 사진 미리보기">
  </div>

  <!-- ===== 인식된 글 (수정 가능) ===== -->
  <div class="card">
    <label for="text">인식된 글 (틀린 곳은 직접 고칠 수 있어요)</label>
    <textarea id="text">Dink, Josh, and Ruth Rose were sitting on Ruth Rose's front porch. It was a hot summer day. "Let's go to the library," said Josh.</textarea>
  </div>

  <!-- ===== 읽기 / 정지 ===== -->
  <div class="card">
    <div class="buttons">
      <button class="big-btn" id="btnSpeak">▶ 읽기</button>
      <button class="big-btn" id="btnStop">■ 정지</button>
    </div>
    <div class="status" id="status">준비 중…</div>
  </div>

  <div class="card">
    <label for="voice">음성 선택</label>
    <select id="voice"><option>음성 불러오는 중…</option></select>
  </div>

  <div class="card">
    <label for="rate">읽기 속도: <span id="rateValue">0.85</span></label>
    <input id="rate" type="range" min="0.6" max="1.0" step="0.05" value="0.85">
    <div class="rate-row"><span>천천히 0.6</span><span>보통 1.0</span></div>
  </div>

  <details class="card">
    <summary>디버그 로그</summary>
    <div id="log"></div>
  </details>
</main>

<!-- Tesseract.js (브라우저 안에서 OCR). 이미지는 밖으로 보내지 않음 -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js"></script>

<script>
// ===== 0. 화면 요소 참조 / 공통 함수 =====
const $text   = document.getElementById('text');
const $voice  = document.getElementById('voice');
const $rate   = document.getElementById('rate');
const $rateV  = document.getElementById('rateValue');
const $status = document.getElementById('status');
const $log    = document.getElementById('log');
const synth   = window.speechSynthesis;

function log(msg) {
  const t = new Date().toLocaleTimeString();
  $log.textContent = `[${t}] ${msg}\n` + $log.textContent;
}
function setStatus(msg) { $status.textContent = msg; }

function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
function load(key)      { try { return localStorage.getItem(key); } catch (e) { return null; } }

// =====================================================================
//  A. 음성 읽기 (1단계와 동일 + 이상한 음성 숨기기)
// =====================================================================
let englishVoices = [];

// iOS/macOS의 효과음·장난용 음성 (아이에게 읽어주기엔 부적합)
const NOVELTY_VOICES = ['Albert', 'Bad News', 'Bahh', 'Bells', 'Boing', 'Bubbles',
  'Cellos', 'Good News', 'Jester', 'Organ', 'Superstar', 'Trinoids', 'Whisper',
  'Wobble', 'Zarvox', 'Fred', 'Junior', 'Kathy', 'Ralph'];

function isEnglish(v) {
  const lang = (v.lang || '').replace('_', '-').toLowerCase();
  return lang === 'en-us' || lang === 'en-gb';
}
function isNovelty(v) {
  return NOVELTY_VOICES.some(n => v.name === n || v.name.startsWith(n + ' '));
}

function loadVoices() {
  const all = synth.getVoices();
  if (all.length === 0) return false;

  englishVoices = all.filter(v => isEnglish(v) && !isNovelty(v));
  englishVoices.sort((a, b) =>
    b.lang.localeCompare(a.lang) || a.name.localeCompare(b.name));   // en-US 먼저

  $voice.innerHTML = '';
  englishVoices.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.voiceURI;
    opt.textContent = `${v.name} (${v.lang})${v.default ? ' ★' : ''}`;
    $voice.appendChild(opt);
  });

  if (englishVoices.length === 0) {
    $voice.innerHTML = '<option>영어 음성이 없습니다</option>';
    setStatus('⚠️ 기기에 영어 음성이 없습니다.');
  } else {
    const saved = load('voiceURI');
    if (saved && englishVoices.some(v => v.voiceURI === saved)) $voice.value = saved;
    setStatus(`✅ 준비 완료 – 영어 음성 ${englishVoices.length}개`);
  }
  log(`음성 로드: 전체 ${all.length}개, 영어 ${englishVoices.length}개`);
  return true;
}

if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
  setStatus('❌ 이 브라우저는 음성 읽기를 지원하지 않습니다.');
} else {
  synth.addEventListener('voiceschanged', () => { log('voiceschanged 이벤트'); loadVoices(); });
  if (!loadVoices()) {
    let tries = 0;
    const timer = setInterval(() => {
      tries++;
      if (loadVoices() || tries > 20) clearInterval(timer);
    }, 250);
  }
}

function selectedVoice() {
  return englishVoices.find(v => v.voiceURI === $voice.value) || null;
}
$voice.addEventListener('change', () => { save('voiceURI', $voice.value); log(`음성 선택: ${$voice.value}`); });

const savedRate = load('rate');
if (savedRate) $rate.value = savedRate;
$rateV.textContent = Number($rate.value).toFixed(2);
$rate.addEventListener('input', () => {
  $rateV.textContent = Number($rate.value).toFixed(2);
  save('rate', $rate.value);
});

function speak() {
  if (!synth) return;
  const text = $text.value.trim();
  if (!text) { setStatus('읽을 글이 없어요.'); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = selectedVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
  u.rate = Number($rate.value);
  u.onstart = () => { setStatus('🔊 읽는 중…'); log(`읽기 시작: rate=${u.rate}, voice=${v ? v.name : '기본'}`); };
  u.onend   = () => { setStatus('✅ 다 읽었어요'); log('읽기 끝'); };
  u.onerror = (e) => { setStatus(`⚠️ 오류: ${e.error}`); log(`읽기 오류: ${e.error}`); };
  synth.speak(u);   // 탭 이벤트 안에서 바로 호출 (iOS 필수)
}
function stop() { if (synth) synth.cancel(); setStatus('⏹ 정지했어요'); log('정지'); }

document.getElementById('btnSpeak').addEventListener('click', speak);
document.getElementById('btnStop').addEventListener('click', stop);

// =====================================================================
//  B. 사진 → 글자 인식 (2단계)
// =====================================================================
const $ocrStatus   = document.getElementById('ocrStatus');
const $ocrProgress = document.getElementById('ocrProgress');
const $preview     = document.getElementById('preview');
const $lblCamera   = document.getElementById('lblCamera');
const $lblAlbum    = document.getElementById('lblAlbum');

const MAX_SIDE = 3000;   // 사진 긴 변을 이 크기로 줄임 (작은 글씨도 읽히게 하되, iPhone 메모리 한도는 넘지 않게)
const MIN_LINE_CONF = 60; // 이 신뢰도(%) 미만인 줄은 그림·뒷면 비침 등 잡음으로 보고 버림
let ocrWorker = null;    // Tesseract 작업자. 처음 한 번만 만들고 계속 재사용
let busy = false;

function setOcrStatus(msg) { $ocrStatus.textContent = msg; }
function setBusy(b) {
  busy = b;
  $lblCamera.classList.toggle('disabled', b);
  $lblAlbum.classList.toggle('disabled', b);
  $ocrProgress.style.display = b ? 'block' : 'none';
}

// (1) Tesseract 작업자 준비 – 처음엔 영어 학습데이터(수 MB)를 내려받아서 시간이 걸림
async function getWorker() {
  if (ocrWorker) return ocrWorker;
  if (typeof Tesseract === 'undefined') throw new Error('Tesseract.js를 불러오지 못했습니다 (인터넷 연결 확인)');
  setOcrStatus('글자 인식 엔진 준비 중… (처음 한 번만 오래 걸려요)');
  const t0 = performance.now();
  // 다운로드 실패 시 무한 대기하지 않도록: 오류 콜백 + 90초 시간 제한
  ocrWorker = await new Promise((resolve, reject) => {
    const timer = setTimeout(() =>
      reject(new Error('엔진 다운로드 시간 초과 – 인터넷 확인 후 다시 찍어 주세요')), 90000);
    Tesseract.createWorker('eng', 1, {
      logger: m => {
        // m.status: 진행 단계 이름, m.progress: 0~1
        if (typeof m.progress === 'number') $ocrProgress.value = Math.round(m.progress * 100);
        if (m.status === 'recognizing text') {
          setOcrStatus(`글자 읽는 중… ${Math.round(m.progress * 100)}%`);
        }
      },
      errorHandler: err => { clearTimeout(timer); reject(new Error('엔진 준비 실패: ' + err)); }
    }).then(
      w   => { clearTimeout(timer); resolve(w); },
      err => { clearTimeout(timer); reject(err); }
    );
  });
  log(`OCR 엔진 준비 완료 (${((performance.now() - t0) / 1000).toFixed(1)}초)`);
  return ocrWorker;
}

// (2) 사진 줄이기 + 흑백 변환 → 인식 속도/정확도 향상
function prepareImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);   // 기기 메모리 안의 임시 주소 (외부 전송 없음)
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);          // 최신 브라우저는 사진 회전(EXIF)을 자동 반영

      // 흑백 변환 (밝기 = 0.299R + 0.587G + 0.114B)
      const data = ctx.getImageData(0, 0, w, h);
      const px = data.data;
      for (let i = 0; i < px.length; i += 4) {
        const g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
        px[i] = px[i + 1] = px[i + 2] = g;
      }
      ctx.putImageData(data, 0, 0);

      URL.revokeObjectURL(url);
      log(`사진 크기: ${img.naturalWidth}x${img.naturalHeight} → ${w}x${h}`);
      resolve(canvas);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 열 수 없습니다')); };
    img.src = url;
  });
}

// (3) 잡음 줄 걸러내기: 신뢰도가 낮거나 글자보다 기호가 많은 줄은 버림
function filterLines(data) {
  if (!data.blocks) return data.text.trim();          // 혹시 줄 정보가 없으면 원문 그대로
  const paragraphs = [];
  let dropped = 0;
  for (const block of data.blocks) {
    for (const para of block.paragraphs) {
      const kept = [];
      for (const line of para.lines) {
        const t = line.text.trim();
        if (!t) continue;
        const chars   = t.replace(/\s/g, '').length;
        const letters = (t.match(/[A-Za-z]/g) || []).length;
        const ok = line.confidence >= MIN_LINE_CONF && letters / chars >= 0.5;
        if (ok) kept.push(t);
        else { dropped++; log(`버린 줄 (${Math.round(line.confidence)}%): ${t}`); }
      }
      if (kept.length) paragraphs.push(kept.join('\n'));
    }
  }
  log(`줄 필터: ${dropped}줄 버림`);
  return paragraphs.join('\n\n');
}

// (4) 사진 선택되면 실행되는 전체 흐름
async function handleFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';                 // 같은 사진을 다시 골라도 동작하도록 초기화
  if (!file || busy) return;

  if (synth) synth.cancel();           // 읽던 것 멈춤
  setBusy(true);
  $ocrProgress.value = 0;
  try {
    setOcrStatus('사진 준비 중…');
    const canvas = await prepareImage(file);
    $preview.src = canvas.toDataURL('image/jpeg', 0.7);   // 화면 미리보기용 (저장 안 함)
    $preview.style.display = 'block';

    const worker = await getWorker();
    const t0 = performance.now();
    // blocks: true → 문단/줄 단위 결과와 줄별 신뢰도까지 받음
    const { data } = await worker.recognize(canvas, {}, { text: true, blocks: true });
    const sec = ((performance.now() - t0) / 1000).toFixed(1);

    const text = filterLines(data);
    log(`인식 완료: ${sec}초, 신뢰도 ${Math.round(data.confidence)}%, ${text.length}자`);
    if (!text) {
      setOcrStatus('😢 글자를 찾지 못했어요. 더 밝고 가까이 다시 찍어 주세요.');
    } else {
      $text.value = text;
      setOcrStatus(`✅ 인식 완료 (${sec}초, 정확도 약 ${Math.round(data.confidence)}%) – ▶ 읽기를 누르세요`);
    }
  } catch (err) {
    setOcrStatus(`⚠️ 오류: ${err.message}`);
    log(`OCR 오류: ${err.message}`);
  } finally {
    setBusy(false);
  }
}

document.getElementById('fileCamera').addEventListener('change', handleFile);
document.getElementById('fileAlbum').addEventListener('change', handleFile);
</script>
</body>
</html>
