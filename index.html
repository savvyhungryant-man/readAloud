<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read Aloud</title>
<style>
  :root {
    --bg: #fffaf0;
    --card: #ffffff;
    --text: #222;
    --muted: #666;
    --primary: #2e7d32;
    --danger: #c62828;
    --camera: #1565c0;
    --highlight: #ffe082;
    --border: #ddd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
  }
  main { max-width: 760px; margin: 0 auto; }
  .col-left, .col-right { display: flex; flex-direction: column; }
  /* 아이패드 가로 등 넓은 화면: 왼쪽 = 카메라(+음성 설정), 오른쪽 = 읽은 글 */
  @media (min-width: 1000px) and (orientation: landscape) {
    main { max-width: none; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .cols { display: flex; gap: 16px; align-items: flex-start; }
    .col-left {
      flex: 0 0 46%; position: sticky; top: 16px;
      max-height: calc(100vh - 32px); overflow-y: auto;   /* 오른쪽 글을 내려도 카메라는 그대로 */
    }
    .col-right { flex: 1; min-width: 0; }
    #cardCamera { order: -1; }                           /* 왼쪽 맨 위에 카메라 */
    #liveVideo { max-height: 62vh; }
  }
  h1 { font-size: 24px; margin: 0 0 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 200px;
    font-family: inherit;
    font-size: 18px;
    line-height: 1.5;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    resize: vertical;
  }
  select {
    width: 100%;
    font-size: 18px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #fff;
  }
  .buttons { display: flex; gap: 12px; }
  .big-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    padding: 22px 0;
    border: none;
    border-radius: 18px;
    color: #fff;
    cursor: pointer;
    text-align: center;
    touch-action: manipulation; /* 더블탭 확대 방지 */
    user-select: none;
    -webkit-user-select: none;
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn.disabled { opacity: 0.4; pointer-events: none; }
  #btnSpeak  { background: var(--primary); }
  #btnStop   { background: var(--danger); }
  .camera-btn { background: var(--camera); }
  .album-btn  { background: #fff; color: var(--camera); border: 2px solid var(--camera); font-size: 18px; flex: 0 0 34%; }
  input[type=file] { display: none; }
  #preview {
    display: none;
    width: 100%;
    max-height: 200px;
    object-fit: contain;
    margin-top: 12px;
    border-radius: 12px;
    background: #eee;
  }
  progress { width: 100%; height: 14px; margin-top: 12px; display: none; }
  /* 앱 안 카메라 */
  #liveBox { display: none; margin-bottom: 12px; }
  #liveVideo { width: 100%; max-height: 55vh; object-fit: contain; background: #000; border-radius: 12px; display: block; }
  .shot-btn  { background: var(--primary); }
  .live-btn  { background: #fff; color: var(--camera); border: 2px solid var(--camera); font-size: 18px; padding: 14px 0; margin-bottom: 12px; }
  .live-off  { background: #fff; color: #888; border: 2px solid #bbb; font-size: 16px; flex: 0 0 28%; }

  /* ===== 문장 보기 ===== */
  #reader { font-size: 24px; line-height: 1.8; }
  #reader p { margin: 0 0 16px; }
  .sent {
    padding: 2px 2px;
    border-radius: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sent.active { background: var(--highlight); }
  .hint { font-size: 14px; color: var(--muted); margin-bottom: 8px; }

  input[type=range] { width: 100%; height: 36px; }
  .rate-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
  #rateValue { font-size: 22px; font-weight: 700; color: var(--text); }
  .status { font-size: 16px; color: var(--muted); margin-top: 12px; }
  #log {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    max-height: 240px;
    overflow-y: auto;
    background: #f4f4f4;
    padding: 8px;
    border-radius: 8px;
  }
  .seg { display: flex; gap: 8px; margin-bottom: 12px; }
  .seg button {
    flex: 1; font-size: 16px; font-weight: 700; padding: 14px 0; white-space: nowrap;
    border-radius: 12px; border: 2px solid var(--camera); background: #fff; color: var(--camera);
    touch-action: manipulation;
  }
  .seg button.on { background: var(--camera); color: #fff; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input {
    flex: 1; min-width: 0; font-size: 18px; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
  }
  .row button {
    font-size: 16px; font-weight: 700; padding: 0 16px; border-radius: 12px; border: none; white-space: nowrap;
    background: var(--primary); color: #fff; touch-action: manipulation;
  }
  details summary { cursor: pointer; color: var(--muted); }
  details[open] summary { margin-bottom: 12px; }
</style>
</head>
<body>
<main>
  <h1>📖 Read Aloud</h1>
  <div class="cols">
  <div class="col-left">
  <div class="card" id="cardVoice">
    <label>음성 종류</label>
    <div class="seg">
      <button id="engDevice" data-engine="device">📱 기기 음성</button>
      <button id="engPiper"  data-engine="piper">🆓 Piper</button>
      <button id="engAi"     data-engine="ai">✨ AI 음성</button>
    </div>

    <div id="deviceBox">
      <select id="voice"><option>음성 불러오는 중…</option></select>
    </div>

    <div id="piperBox" style="display:none">
      <select id="piperVoice">
        <option value="en_US-amy-medium">Amy (여성) – 추천</option>
        <option value="en_US-hfc_female-medium">HFC (여성)</option>
        <option value="en_US-lessac-medium">Lessac (여성)</option>
        <option value="en_US-kristin-medium">Kristin (여성)</option>
        <option value="en_GB-alba-medium">Alba (영국 여성)</option>
        <option value="en_US-ryan-medium">Ryan (남성)</option>
        <option value="en_US-joe-medium">Joe (남성)</option>
      </select>
      <div class="hint" style="margin-top:8px">무료 · 이 기기 안에서 음성을 만들어요. 음성마다 처음 한 번 약 60MB를 받아 기기에 보관해요.</div>
      <div class="hint" id="piperInfo" style="margin-top:4px"></div>
    </div>

    <div id="aiBox" style="display:none">
      <select id="aiVoice">
        <option value="coral">Coral (여성, 따뜻함) – 추천</option>
        <option value="nova">Nova (여성, 밝음)</option>
        <option value="shimmer">Shimmer (여성, 부드러움)</option>
        <option value="sage">Sage (여성, 차분함)</option>
        <option value="fable">Fable (영국식, 이야기꾼)</option>
        <option value="ballad">Ballad (남성, 부드러움)</option>
        <option value="alloy">Alloy (중성)</option>
        <option value="ash">Ash (남성)</option>
        <option value="echo">Echo (남성)</option>
        <option value="onyx">Onyx (남성, 낮음)</option>
        <option value="verse">Verse (남성, 표현력)</option>
      </select>
      <div class="row">
        <input id="aiPassword" type="password" placeholder="비밀번호" autocomplete="current-password">
        <button id="aiTest">🔊 들어보기</button>
      </div>
      <div class="hint" style="margin-top:8px">비밀번호와 받은 음성은 이 기기에만 저장돼요. 한 번 읽은 문장은 다음부터 요금이 들지 않아요.</div>
      <div class="row" style="align-items:center">
        <div id="storeInfo" class="hint" style="flex:1;margin:0">💾 기기에 저장된 음성: 확인 중…</div>
        <button id="storeClear" style="background:#888">지우기</button>
      </div>
    </div>
  </div>


  <!-- ===== 사진 찍기 ===== -->
  <div class="card" id="cardCamera">
    <!-- 앱 안 카메라: 미리보기를 띄워 두고 버튼 한 번으로 찍고 바로 읽기 -->
    <button class="big-btn live-btn" id="btnLiveOn" style="width:100%">🎥 카메라 켜기 (한 번에 찍고 읽기)</button>
    <div id="liveBox">
      <video id="liveVideo" playsinline muted autoplay></video>
      <div class="buttons" style="margin-top:10px">
        <button class="big-btn shot-btn" id="btnShot">📸 찍고 읽기</button>
        <button class="big-btn live-off" id="btnLiveOff">끄기</button>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:16px">
        <input type="checkbox" id="autoTurn" style="width:22px;height:22px"> 페이지 넘기면 자동으로 읽기
      </label>
    </div>
    <div class="buttons">
      <label class="big-btn camera-btn" id="lblCamera" for="fileCamera">📷 사진 찍기</label>
      <label class="big-btn album-btn"  id="lblAlbum"  for="fileAlbum">🖼 앨범</label>
    </div>
    <input id="fileCamera" type="file" accept="image/*" capture="environment">
    <input id="fileAlbum"  type="file" accept="image/*">
    <progress id="ocrProgress" max="100" value="0"></progress>
    <div class="status" id="ocrStatus">책 페이지를 찍어 주세요.</div>
    <img id="preview" alt="찍은 사진 미리보기">
  </div>

  </div><!-- /col-left -->
  <div class="col-right">
  <!-- ===== 읽기 / 정지 ===== -->
  <div class="card">
    <div class="buttons">
      <button class="big-btn" id="btnSpeak">▶ 읽기</button>
      <button class="big-btn" id="btnStop">■ 정지</button>
    </div>
    <div class="status" id="status">준비 중…</div>
  </div>

  <!-- ===== 문장 보기 (탭하면 그 문장만 읽기) ===== -->
  <div class="card">
    <div class="hint">👆 문장을 누르면 그 문장만 다시 읽어요</div>
    <div id="reader"></div>
  </div>

  <!-- ===== 글 고치기 (평소엔 접어 둠) ===== -->
  <details class="card">
    <summary>✏️ 글 고치기</summary>
    <div class="hint">틀린 글자를 고치면 위 문장 보기에 바로 반영돼요. 빈 줄 = 문단 나눔</div>
    <textarea id="text">Dink, Josh, and Ruth Rose were sitting on Ruth Rose's front porch. It was a hot summer day. "Let's go to the library," said Josh.

"Who sent this?" asked Josh. Mr. Pocket shook his head.</textarea>
  </details>

  <div class="card">
    <label for="rate">읽기 속도: <span id="rateValue">0.85</span></label>
    <input id="rate" type="range" min="0.6" max="1.5" step="0.05" value="0.85">
    <div class="rate-row"><span>천천히 0.6</span><span>보통 1.0</span><span>빠르게 1.5</span></div>
  </div>

  <details class="card">
    <summary>디버그 로그</summary>
    <div id="log"></div>
  </details>
  </div><!-- /col-right -->
  </div><!-- /cols -->
</main>

<!-- ONNX Runtime (브라우저 안에서 PaddleOCR 모델 실행). 사진은 밖으로 보내지 않음 -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.wasm.min.js"></script>

<script>
// ===== 0. 화면 요소 참조 / 공통 함수 =====
const $text   = document.getElementById('text');
const $reader = document.getElementById('reader');
const $voice  = document.getElementById('voice');
const $rate   = document.getElementById('rate');
const $rateV  = document.getElementById('rateValue');
const $status = document.getElementById('status');
const $log    = document.getElementById('log');
const synth   = window.speechSynthesis;

function log(msg) {
  const t = new Date().toLocaleTimeString();
  $log.textContent = `[${t}] ${msg}\n` + $log.textContent;
}
function setStatus(msg) { $status.textContent = msg; }

function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
function load(key)      { try { return localStorage.getItem(key); } catch (e) { return null; } }

// =====================================================================
//  A. 음성 목록
// =====================================================================
let englishVoices = [];

// iOS/macOS의 효과음·장난용 음성 (아이에게 읽어주기엔 부적합)
const NOVELTY_VOICES = ['Albert', 'Bad News', 'Bahh', 'Bells', 'Boing', 'Bubbles',
  'Cellos', 'Good News', 'Jester', 'Organ', 'Superstar', 'Trinoids', 'Whisper',
  'Wobble', 'Zarvox', 'Fred', 'Junior', 'Kathy', 'Ralph'];

function isEnglish(v) {
  return (v.lang || '').replace('_', '-').toLowerCase().startsWith('en');
}
function isNovelty(v) {
  return NOVELTY_VOICES.some(n => v.name === n || v.name.startsWith(n + ' '));
}
// 음질 등급: iOS는 이름이 같아도 voiceURI에 premium / enhanced / compact 가 붙어 구분됨
function quality(v) {
  const s = (v.voiceURI + ' ' + v.name).toLowerCase();
  if (s.includes('premium'))  return 2;
  if (s.includes('enhanced')) return 1;
  if (s.includes('super-compact')) return -1;
  return 0;
}
const QUALITY_LABEL = { '-1': ' – 저음질', 0: '', 1: ' – 고음질', 2: ' – 프리미엄' };

function loadVoices() {
  const all = synth.getVoices();
  if (all.length === 0) return false;

  const seen = new Set();
  englishVoices = all.filter(v => {
    if (!isEnglish(v) || seen.has(v.voiceURI)) return false;
    seen.add(v.voiceURI);
    return true;
  });
  // 효과음 음성은 맨 아래 → 좋은 음질 먼저 → en-US 먼저 → 이름순
  const order = l => l === 'en-US' ? 0 : l === 'en-GB' ? 1 : 2;
  englishVoices.sort((a, b) =>
    isNovelty(a) - isNovelty(b) || quality(b) - quality(a) ||
    order(a.lang) - order(b.lang) || a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));

  $voice.innerHTML = '';
  englishVoices.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.voiceURI;
    opt.textContent = `${v.name} (${v.lang})${QUALITY_LABEL[quality(v)]}${isNovelty(v) ? ' – 효과음' : ''}`;
    $voice.appendChild(opt);
    log(`음성: ${v.name} | ${v.lang} | ${v.voiceURI}`);
  });

  if (englishVoices.length === 0) {
    $voice.innerHTML = '<option>영어 음성이 없습니다</option>';
    setStatus('⚠️ 기기에 영어 음성이 없습니다.');
  } else {
    const saved = load('voiceURI');
    if (saved && englishVoices.some(v => v.voiceURI === saved)) $voice.value = saved;
    setStatus(`✅ 준비 완료 – 영어 음성 ${englishVoices.length}개`);
  }
  log(`음성 로드: 전체 ${all.length}개, 영어 ${englishVoices.length}개`);
  return true;
}

if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
  setStatus('❌ 이 브라우저는 음성 읽기를 지원하지 않습니다.');
} else {
  synth.addEventListener('voiceschanged', () => loadVoices());
  if (!loadVoices()) {
    let tries = 0;
    const timer = setInterval(() => {
      tries++;
      if (loadVoices() || tries > 20) clearInterval(timer);
    }, 250);
  }
}

function selectedVoice() {
  return englishVoices.find(v => v.voiceURI === $voice.value) || null;
}
$voice.addEventListener('change', () => { save('voiceURI', $voice.value); log(`음성 선택: ${$voice.value}`); });

// 음성 종류마다 속도를 따로 기억 (Piper Amy는 원래 말이 느린 편이라 기본을 조금 빠르게)
const DEFAULT_RATE = { device: '0.85', piper: '1.15', ai: '1.0' };
function loadRateFor(e) { $rate.value = load('rate_' + e) || (e === 'device' && load('rate')) || DEFAULT_RATE[e]; }
function updateRateLabel() {
  const v = Number($rate.value).toFixed(2);
  $rateV.textContent = engine === 'ai' ? `${v} (AI: ${PACE_LABEL[aiPace()]})` : v;
}
$rate.addEventListener('input', () => {
  updateRateLabel();
  save('rate_' + engine, $rate.value);
  // Piper는 재생 속도로 조절하므로 읽는 도중에도 바로 반영
  if (engine === 'piper') { audio.defaultPlaybackRate = Number($rate.value); audio.playbackRate = Number($rate.value); }
});

// =====================================================================
//  B. 글 정리 (3단계) – 쪽번호·머리글 제거, 끊긴 줄 합치기
// =====================================================================

// 쪽번호만 있는 줄: "41", "- 41 -", "41 |" 등
function isPageNumber(line) {
  return /^[^A-Za-z]*\d+[^A-Za-z]*$/.test(line);
}
// 머리글/바닥글: 짧고(단어 5개 이하) 문장부호로 끝나지 않는 줄. 예) "View Ridge -", "12 The Absent Author"
function isHeader(line) {
  const core = line.replace(/[\s\-–—|_~·•*]+$/, '');     // 끝의 잡기호 떼고 판단
  const words = core.split(/\s+/).filter(w => /[A-Za-z]/.test(w));
  return words.length <= 5 && !/[.!?,;:"”’']$/.test(core);
}

function cleanText(raw) {
  // (1) 줄 단위 정리
  let lines = raw.split('\n').map(l => l
    .replace(/(^|\s)\|(?=\s|$)/g, '$1I')         // 홀로 있는 "|" 는 대개 대문자 I 의 오인식
    .replace(/(^|\s)[\[\]{}\\\/<>]+(?=\s|$)/g, '$1') // 홀로 있는 괄호·빗금 잡기호
    .replace(/^(?:[b-hj-z]|\d) (?=[a-z])/, '')    // 줄 맨 앞 외톨이 글자 (a, I 제외): "y nonpartisan" → "nonpartisan"
    .replace(/^[|_~•·*]+\s*/, '')                 // 줄 앞 잡기호
    .replace(/\s*[|_~•·*]+$/, '')                 // 줄 끝 잡기호
    .replace(/\s+/g, ' ')
    .trim());

  // (2) 쪽번호 줄은 어디 있든 제거, 머리글/바닥글은 페이지 맨 위·아래 2줄 안에서만 제거
  const filled = lines.map((l, i) => l ? i : -1).filter(i => i >= 0);
  const edges = new Set([...filled.slice(0, 2), ...filled.slice(-2)]);
  lines = lines.map((l, i) => {
    if (!l) return l;
    if (isPageNumber(l))               { log(`정리: 쪽번호 제거 "${l}"`); return ''; }
    if (edges.has(i) && isHeader(l))   { log(`정리: 머리글/바닥글 제거 "${l}"`); return ''; }
    return l;
  });

  // (3) 줄바꿈으로 끊긴 문장 합치기
  //     빈 줄(문단 경계)이라도 앞 문장이 . ! ? 로 끝나지 않았으면 문장이 이어지는 것으로 보고 합침
  const paras = [];
  let cur = '';
  for (const l of lines) {
    if (!l) {
      if (cur && /[.!?…]["'”’)]*$/.test(cur)) { paras.push(cur); cur = ''; }
      continue;
    }
    if (!cur)                                              cur = l;
    else if (/[A-Za-z]-$/.test(cur) && /^[a-z]/.test(l))   cur = cur.slice(0, -1) + l;  // "publi-" + "cized"
    else if (/[—–]$/.test(cur))                            cur += l;                     // 줄 끝 긴 대시
    else                                                   cur += ' ' + l;
  }
  if (cur) paras.push(cur);
  // 줄을 합친 뒤에 처리: 소문자 단어 사이 외톨이 "1" 은 대개 "I" 의 오인식 ("sisters and 1 were")
  return paras.map(p => p.replace(/(\b[a-z]+ )1(?= [a-z])/g, '$1I')).join('\n\n');
}

// =====================================================================
//  C. 문장 나누기 + 문장 보기 화면
// =====================================================================

// 마침표가 있어도 문장 끝이 아닌 약어
const ABBREVIATIONS = /\b(Mr|Mrs|Ms|Dr|St|Jr|Sr|Mt|vs|etc|e\.g|i\.e)\.$/i;

function splitSentences(para) {
  // 문장부호(. ! ? …) + (닫는 따옴표) + 공백 + 다음이 대문자/숫자/여는 따옴표로 시작하면 문장 끝
  const re = /[.!?…]+["'”’)\]]*\s+(?=["'“‘(]?[A-Z0-9])/g;
  const out = [];
  let start = 0, m;
  while ((m = re.exec(para))) {
    const end = m.index + m[0].length;
    const chunk = para.slice(start, end).trim();
    const lastWord = chunk.split(' ').pop();
    if (ABBREVIATIONS.test(chunk) || /^[A-Z]\.$/.test(lastWord)) continue;   // Mr. / J. 같은 경우 계속
    out.push(chunk);
    start = end;
  }
  const rest = para.slice(start).trim();
  if (rest) out.push(rest);
  return out;
}

let sentences = [];   // [{ text, el }]

function renderSentences() {
  lastReadIdx = -1;
  stopReading(true);
  $reader.innerHTML = '';
  sentences = [];
  const paras = $text.value.split(/\n\s*\n/)
    .map(p => p.replace(/\s+/g, ' ').trim())
    .filter(Boolean);
  for (const p of paras) {
    const pEl = document.createElement('p');
    for (const s of splitSentences(p)) {
      const i = sentences.length;
      const span = document.createElement('span');
      span.className = 'sent';
      span.textContent = s;
      span.addEventListener('click', () => { if (isRealTap()) speakList([i]); });   // 탭 → 그 문장만
      sentences.push({ text: s, el: span });
      pEl.appendChild(span);
      pEl.appendChild(document.createTextNode(' '));
    }
    $reader.appendChild(pEl);
  }
  if (!sentences.length) $reader.innerHTML = '<p class="hint">읽을 글이 없어요. 사진을 찍어 주세요.</p>';
  log(`문장 나누기: 문단 ${paras.length}개, 문장 ${sentences.length}개`);
}

// 스크롤하다 손을 뗀 것을 "탭"으로 오인하지 않도록:
//  ① 손가락이 10px 넘게 움직였거나 ② 손가락으로 스크롤한 직후(관성 스크롤 포함 0.4초 이내)면 탭이 아님
//  (글자·상태 문구가 바뀌며 화면이 저절로 밀리는 스크롤은 사용자 스크롤로 치지 않음)
let touchStartY = 0, touchMoved = false, touching = false, touchEndAt = 0, lastScrollAt = 0;
document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; touchMoved = false; touching = true; }, { passive: true });
document.addEventListener('touchmove',  e => { if (Math.abs(e.touches[0].clientY - touchStartY) > 10) touchMoved = true; }, { passive: true });
document.addEventListener('touchend',   () => { touching = false; touchEndAt = Date.now(); }, { passive: true });
window.addEventListener('scroll', () => {
  if (touching || Date.now() - touchEndAt < 1500) lastScrollAt = Date.now();
}, { passive: true });
function isRealTap() {
  if (touchMoved || Date.now() - lastScrollAt < 400) { log('스크롤 중 터치 → 무시'); return false; }
  return true;
}

let highlighted = -1;
let lastReadIdx = -1;      // 마지막으로 읽기 시작한 문장 번호 (페이지 넘김 자동 감지에 사용)
let readingActive = false; // 지금 읽는 중인지
function highlight(i) {
  if (highlighted >= 0 && sentences[highlighted]) sentences[highlighted].el.classList.remove('active');
  highlighted = i;
  if (i >= 0) lastReadIdx = i;
  if (i >= 0 && sentences[i]) {
    sentences[i].el.classList.add('active');
    sentences[i].el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// =====================================================================
//  D. 문장 단위로 읽기
// =====================================================================
let session = 0;      // 읽기 묶음 번호. 정지/새 읽기 때 증가 → 이전 묶음의 늦은 이벤트는 무시
let liveUtts = [];    // iOS에서 읽는 도중 객체가 사라져 이벤트가 안 오는 문제 방지용 보관

function makeUtterance(text) {
  const u = new SpeechSynthesisUtterance(text);
  const v = selectedVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
  u.rate = Number($rate.value);
  return u;
}

// 읽기 진입점: 선택한 음성 종류에 따라 기기 음성 / AI 음성으로 나눔
function speakList(indices) {
  if (!indices.length) return;
  readingActive = true;
  if (engine === 'device') deviceSpeakList(indices);
  else                     audioSpeakList(indices);   // AI / Piper: 음성 파일을 만들어 재생
}

// [기기 음성] 여러 문장을 탭한 순간 한꺼번에 대기열에 넣음 → iOS의 "사용자 탭으로만 재생" 제약을 한 번에 통과
function deviceSpeakList(indices) {
  if (!synth) return;
  synth.cancel();
  const my = ++session;
  liveUtts = [];
  const last = indices[indices.length - 1];

  for (const i of indices) {
    const u = makeUtterance(sentences[i].text);
    u.onstart = () => {
      if (my !== session) return;
      highlight(i);
      setStatus(`🔊 읽는 중… (${i + 1} / ${sentences.length})`);
    };
    u.onend = () => {
      if (my !== session || i !== last) return;
      highlight(-1);
      readingActive = false;
      setStatus('✅ 다 읽었어요');
      log('읽기 끝');
    };
    u.onerror = (e) => {
      if (my !== session || e.error === 'interrupted' || e.error === 'canceled') return;
      setStatus(`⚠️ 오류: ${e.error}`);
      log(`읽기 오류 (${i + 1}번 문장): ${e.error}`);
    };
    liveUtts.push(u);
    synth.speak(u);
  }
  const v = selectedVoice();
  log(`읽기 시작: ${indices.length}문장, rate=${$rate.value}, voice=${v ? v.name : '기본'}`);
}

function speakAll() {
  if (!sentences.length) { setStatus('읽을 글이 없어요.'); return; }
  speakList(sentences.map((_, i) => i));
}

function stopReading(silent) {
  session++;
  readingActive = false;
  if (synth) synth.cancel();
  stopAudio();
  highlight(-1);
  if (!silent) { setStatus('⏹ 정지했어요'); log('정지'); }
}

document.getElementById('btnSpeak').addEventListener('click', speakAll);
document.getElementById('btnStop').addEventListener('click', () => stopReading(false));
$text.addEventListener('input', renderSentences);     // 글을 고치면 문장 보기 갱신

// --- iOS 재생 허용 받기: 탭하는 순간 같은 Audio 객체로 아주 짧은 무음을 재생해 둠
//     (그 뒤로는 네트워크를 기다렸다가 재생해도 iOS가 막지 않음)
function makeSilentWav() {
  const n = 800, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const SILENT_WAV = makeSilentWav();
function unlockAudio() {
  if (audioUnlocked) return;
  audio.src = SILENT_WAV;
  audio.play().then(() => { audioUnlocked = true; log('오디오 재생 허용됨'); })
              .catch(e => {
                // AbortError = 무음이 끝나기 전에 진짜 음성으로 바뀐 것 → 허용은 이미 받은 상태
                if (e.name === 'AbortError') audioUnlocked = true;
                else log(`오디오 허용 실패: ${e.name}`);
              });
}

// --- 기기 저장소 (IndexedDB): 받은 AI 음성을 기기에 보관 → 같은 문장은 다음에 0원
//     iPhone 사파리는 Blob 저장에 버그가 있던 적이 있어 ArrayBuffer(원본 바이트)로 저장
const DB_NAME = 'readaloud', STORE = 'audio';
const MAX_BYTES = 200 * 1024 * 1024;   // 최대 200MB. 넘으면 오래 안 쓴 것부터 지움
// AI 음성은 재생을 늦추면 소리가 뭉개지므로, 속도 슬라이더를 "말하는 빠르기" 3단계로 바꿔 AI에게 요청
function aiPace() {
  const r = Number($rate.value);
  return r >= 0.95 ? 'normal' : r >= 0.8 ? 'slow' : 'very_slow';
}
const PACE_LABEL = { normal: '보통', slow: '조금 천천히', very_slow: '천천히' };
let dbPromise = null;

function idb(req) {
  return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
}
function openDb() {
  if (!dbPromise) {
    dbPromise = new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }).catch(e => { log(`기기 저장소 사용 불가: ${e}`); return null; });
  }
  return dbPromise;
}
async function dbGet(key) {
  try {
    const db = await openDb(); if (!db) return null;
    const rec = await idb(db.transaction(STORE).objectStore(STORE).get(key));
    if (!rec) return null;
    rec.t = Date.now();                                            // 마지막 사용 시각 갱신
    db.transaction(STORE, 'readwrite').objectStore(STORE).put(rec, key);
    return rec.buf;
  } catch (e) { log(`저장소 읽기 오류: ${e}`); return null; }
}
async function dbPut(key, buf) {
  try {
    const db = await openDb(); if (!db) return;
    await idb(db.transaction(STORE, 'readwrite').objectStore(STORE).put({ buf, size: buf.byteLength, t: Date.now() }, key));
    if (keyIndex && !keyIndex.includes(key)) keyIndex.push(key);
    await dbPrune();
  } catch (e) { log(`저장소 쓰기 오류: ${e}`); }
}
// 전체 목록(키, 크기, 마지막 사용 시각) – 음성 데이터 자체는 읽지 않음
async function dbList() {
  const db = await openDb(); if (!db) return [];
  return new Promise((res, rej) => {
    const out = [];
    const req = db.transaction(STORE).objectStore(STORE).openCursor();
    req.onsuccess = () => {
      const c = req.result;
      if (c) { out.push({ key: c.key, size: c.value.size, t: c.value.t }); c.continue(); } else res(out);
    };
    req.onerror = () => rej(req.error);
  });
}
async function dbPrune() {
  const list = await dbList();
  let total = list.reduce((s, x) => s + x.size, 0);
  if (total <= MAX_BYTES) return showStoreInfo(list);
  const db = await openDb();
  list.sort((a, b) => a.t - b.t);                                  // 오래 안 쓴 순
  for (const x of list) {
    if (total <= MAX_BYTES * 0.9) break;
    await idb(db.transaction(STORE, 'readwrite').objectStore(STORE).delete(x.key));
    total -= x.size;
  }
  keyIndex = null;   // 색인 다시 만들기
  log('저장 공간 정리: 오래된 음성 삭제');
  showStoreInfo();
}
async function showStoreInfo(list) {
  try {
    list = list || await dbList();
    const mb = list.reduce((s, x) => s + x.size, 0) / 1024 / 1024;
    document.getElementById('storeInfo').textContent = `💾 기기에 저장된 음성: ${list.length}개 · ${mb.toFixed(1)}MB`;
  } catch (e) {}
}
document.getElementById('storeClear').addEventListener('click', async () => {
  if (!confirm('기기에 저장된 AI 음성을 모두 지울까요?')) return;
  const db = await openDb(); if (!db) return;
  await idb(db.transaction(STORE, 'readwrite').objectStore(STORE).clear());
  aiCache.clear();
  keyIndex = null;
  log('저장된 음성 모두 삭제');
  showStoreInfo();
});
// 브라우저에게 "이 데이터는 함부로 지우지 말아 달라"고 요청 (허용 여부는 브라우저가 결정)
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().then(ok => log(`영구 보관 요청: ${ok ? '허용' : '거절(기본 규칙 적용)'}`)).catch(() => {});
}
showStoreInfo();

// --- 문장 비교 도구 (3-1단계 "새 페이지인지" 판단에도 재사용 예정)
// 비교용으로 문장 다듬기: 소문자, 문장부호·따옴표 제거, 공백 정리
function normText(t) {
  return t.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
// 두 글의 차이 글자 수 (편집 거리). max를 넘으면 계산을 멈추고 max+1 반환
function editDistance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < rowMin) rowMin = cur[j];
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
// 허용 차이: 20글자 미만 문장은 0(완전히 같아야 함), 그 이상은 길이의 6% (최대 4글자)
function allowedDiff(len) { return len < 20 ? 0 : Math.min(4, Math.max(1, Math.floor(len * 0.06))); }

// 저장된 음성 키 목록 (메모리 색인). 키 = "목소리|빠르기|문장"
let keyIndex = null;
async function getKeyIndex() {
  if (!keyIndex) {
    keyIndex = [];
    try { for (const x of await dbList()) keyIndex.push(x.key); } catch (e) {}
  }
  return keyIndex;
}
// 같은 목소리·빠르기로 저장된 문장 중 "거의 같은" 것 찾기
async function findSimilarKey(voice, pace, norm) {
  const prefix = `${voice}|${pace}|`;
  const max = allowedDiff(norm.length);
  let best = null, bestD = max + 1;
  for (const k of await getKeyIndex()) {
    if (!k.startsWith(prefix)) continue;
    const d = editDistance(norm, normText(k.slice(prefix.length)), Math.min(max, bestD - 1));
    if (d < bestD) { best = k; bestD = d; if (d === 0) break; }
  }
  return best ? { key: best, diff: bestD } : null;
}

// --- 문장 하나의 AI 음성 가져오기: ① 메모리 → ② 기기 저장소(같은 문장) → ③ 기기 저장소(거의 같은 문장) → ④ 서버(유료)
function fetchAudio(text) {
  const voice = $aiVoice.value;
  const pace = aiPace();
  const norm = normText(text);
  const key = `${voice}|${pace}|${norm}`;
  if (!aiCache.has(key)) {
    const p = (async () => {
      let saved = await dbGet(key);
      if (saved) {
        log(`저장된 음성 사용 (0원): ${text.slice(0, 30)}…`);
      } else {
        const sim = await findSimilarKey(voice, pace, norm);
        if (sim) saved = await dbGet(sim.key);
        if (saved) log(`비슷한 문장의 저장 음성 사용 (0원, ${sim.diff}글자 차이): ${text.slice(0, 30)}…`);
      }
      if (saved) return URL.createObjectURL(new Blob([saved], { type: 'audio/mpeg' }));

      const t0 = performance.now();
      const r = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-App-Password': $aiPassword.value.trim() },
        body: JSON.stringify({ text, voice, pace }),
      });
      if (!r.ok) {
        let info = {};
        try { info = await r.json(); } catch (e) {}
        if (r.status === 401) throw new Error('비밀번호가 틀렸어요');
        throw new Error(`AI 음성 오류 ${r.status} ${info.error || ''} ${info.detail || ''}`.trim());
      }
      const buf = await r.arrayBuffer();
      log(`AI 음성 받음 (${((performance.now() - t0) / 1000).toFixed(1)}초, 유료): ${text.slice(0, 30)}…`);
      dbPut(key, buf);                                   // 기기에 보관 (기다리지 않음)
      return URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' }));
    })();
    p.catch(() => aiCache.delete(key));   // 실패한 건 저장하지 않음 → 다음에 다시 시도
    aiCache.set(key, p);
  }
  return aiCache.get(key);
}

// --- mp3 한 개 재생하고 끝날 때까지 기다리기
function playUrl(url, rate = 1) {
  return new Promise((resolve, reject) => {
    audioDone = resolve;
    audio.onended = () => resolve();
    audio.onerror = () => reject(new Error('음성 재생 실패'));
    audio.src = url;
    // AI 음성은 원래 속도(빠르기는 AI가 말할 때 조절). Piper는 빠르기 조절 기능이 없어 재생 속도로 조절
    audio.preservesPitch = true;
    audio.defaultPlaybackRate = rate;
    audio.playbackRate = rate;
    audio.play().catch(reject);
  });
}

function stopAudio() {
  audio.pause();
  if (audioDone) { audioDone(); audioDone = null; }
}

// --- 여러 문장을 차례로: 받기 → 재생, 재생하는 동안 다음 문장을 미리 받아 둠
async function audioSpeakList(indices) {
  const isAi = engine === 'ai';
  if (isAi && !$aiPassword.value.trim()) { setStatus('🔑 AI 음성 비밀번호를 먼저 입력하세요'); $aiPassword.focus(); return; }
  stopReading(true);
  const my = session;
  unlockAudio();                       // ← 탭 순간에 바로 실행되어야 함 (await 전에)
  const getUrl   = isAi ? fetchAudio : piperAudio;
  const ahead    = isAi ? PREFETCH : PIPER_PREFETCH;
  const playRate = isAi ? 1 : Number($rate.value);
  const name     = isAi ? 'AI' : 'Piper';
  log(`${name} 읽기 시작: ${indices.length}문장, voice=${isAi ? $aiVoice.value : $piperVoice.value}, 속도=${$rate.value}`);

  for (let k = 0; k < indices.length; k++) {
    const i = indices[k];
    let url;
    try {
      setStatus(`⏳ 음성 준비 중… (${i + 1} / ${sentences.length})`);
      url = await getUrl(sentences[i].text);
    } catch (e) {
      if (my === session) { highlight(-1); setStatus(`⚠️ ${e.message}`); log(`${name} 오류: ${e.message}`); }
      return;
    }
    if (my !== session) return;                                   // 그 사이 정지/다른 문장 선택됨
    // 다음 3문장 미리 받기 (짧은 문장은 재생이 1초 안팎이라, 1문장만 미리 받으면 받는 시간 2초를 못 가림)
    for (let j = k + 1; j < Math.min(k + 1 + ahead, indices.length); j++)
      getUrl(sentences[indices[j]].text).catch(() => {});

    highlight(i);
    setStatus(`🔊 읽는 중… (${i + 1} / ${sentences.length})`);
    try { await playUrl(url, playRate); }
    catch (e) {
      if (my === session) { highlight(-1); setStatus(`⚠️ ${e.message}`); log(`재생 오류: ${e.message}`); }
      return;
    }
    if (my !== session) return;
  }
  highlight(-1);
  readingActive = false;
  setStatus('✅ 다 읽었어요');
  log(`${name} 읽기 끝`);
}

// =====================================================================
//  H. Piper 음성 (무료, 기기 안에서 만듦)
//     첫 사용 때 음성 모델(약 60MB)을 받아 기기 저장소(OPFS)에 보관 → 다음부터는 바로
// =====================================================================
const PIPER_LIB = 'https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1.0.3/+esm';
const PIPER_PREFETCH = 2;              // 만들기가 빨라서 2문장만 미리 만들어도 충분
const $piperVoice = document.getElementById('piperVoice');
const $piperInfo  = document.getElementById('piperInfo');
const piperCache  = new Map();         // "음성|문장" → 음성 주소(Promise)
let piperLib = null;
let piperReady = {};                   // 음성별 준비 Promise
let piperQueue = Promise.resolve();    // 한 번에 한 문장씩만 만들도록 줄 세우기 (동시에 만들면 메모리 부담)

$piperVoice.value = load('piperVoice') || 'en_US-amy-medium';
$piperVoice.addEventListener('change', () => { save('piperVoice', $piperVoice.value); stopReading(true); preparePiper(); });

function preparePiper() {
  const voice = $piperVoice.value;
  if (!piperReady[voice]) {
    piperReady[voice] = (async () => {
      const t0 = performance.now();
      $piperInfo.textContent = '⏳ 준비 중…';
      piperLib = piperLib || await import(PIPER_LIB);
      const stored = await piperLib.stored().catch(() => []);
      if (!stored.includes(voice)) {
        let last = -1;
        await piperLib.download(voice, p => {
          if (!p.total) return;
          const pct = Math.round(p.loaded / p.total * 100);
          if (pct !== last) { last = pct; $piperInfo.textContent = `⏳ 음성 모델 받는 중… ${pct}% (처음 한 번만)`; }
        });
      }
      $piperInfo.textContent = '✅ 준비 완료';
      log(`Piper ${voice} 준비 (${((performance.now() - t0) / 1000).toFixed(1)}초)`);
    })();
    piperReady[voice].catch(e => {
      delete piperReady[voice];
      $piperInfo.textContent = `⚠️ 준비 실패: ${e.message}`;
      log(`Piper 준비 실패: ${e.message}`);
    });
  }
  return piperReady[voice];
}

// Piper는 대문자 약어를 단어처럼 읽음 (YMCA → "임카"). 그래서 소리 내서 읽기 어려운 대문자 약어는
// 글자 사이를 띄워서 넘김 → "Y M C A"처럼 한 글자씩 읽음. 화면에 보이는 글은 그대로.
const SPELL_WORDS = new Set(['USA', 'UK', 'EU', 'UN', 'CEO', 'ABC', 'ABCS', 'ATM', 'IOU', 'UFO', 'USB', 'ID', 'IQ', 'AI', 'CIA', 'PE', 'DJ']);
const SAY_AS_WORD = new Set(['NASA', 'NATO', 'LEGO', 'UNICEF', 'SCUBA', 'LASER', 'RADAR']);
const ONSETS = new Set('bl br ch cl cr dr dw fl fr gh gl gn gr kl kn kr ph pl pr ps qu sc sh sk sl sm sn sp st sv sw th tr ts tw wh wr'.split(' '));
function needsSpelling(w) {
  const u = w.toUpperCase(), l = w.toLowerCase();
  if (SAY_AS_WORD.has(u)) return false;
  if (SPELL_WORDS.has(u)) return true;
  if (/^(.)\1+$/.test(l)) return false;                          // ZZZ, MMM 같은 소리
  if (/^(sh+|hm+|gr+|br+|ps+t|tsk|hmph|pf+t|ugh|argh)$/.test(l)) return false;
  const hasVowel = /[aeiou]/.test(l) || /.y/.test(l);            // 맨 앞이 아닌 y는 모음 역할 (MY, SKY)
  if (!hasVowel) return true;                                    // TV, DVD, YMC…
  const c2 = l.slice(0, 2);
  return !/[aeiou]/.test(c2) && !(c2[1] === 'y' && c2[0] !== 'y') && !ONSETS.has(c2);   // YM-, FB-, NB- 로 시작
}
function piperText(text) {
  return text.replace(/\b([A-Z]{2,5})(s?)\b/g, (m, w, s) =>
    needsSpelling(w) ? w.split('').join(' ') + (s ? "'s" : '') : m);
}

function piperAudio(text) {
  const voice = $piperVoice.value;
  text = piperText(text);
  const key = `${voice}|${normText(text)}`;
  if (!piperCache.has(key)) {
    const p = (async () => {
      await preparePiper();
      const job = piperQueue.then(async () => {
        const t0 = performance.now();
        const wav = await piperLib.predict({ text, voiceId: voice });
        log(`Piper 음성 만듦 (${((performance.now() - t0) / 1000).toFixed(1)}초): ${text.slice(0, 30)}…`);
        return URL.createObjectURL(wav);
      });
      piperQueue = job.catch(() => {});
      return job;
    })();
    p.catch(() => piperCache.delete(key));
    piperCache.set(key, p);
  }
  return piperCache.get(key);
}

setEngine(engine);   // 저장된 음성 종류로 시작 (Piper 부분까지 정의된 뒤에 호출)

// --- 들어보기 버튼: 비밀번호·연결 확인용 짧은 문장
document.getElementById('aiTest').addEventListener('click', async () => {
  save('aiPassword', $aiPassword.value.trim());
  if (!$aiPassword.value.trim()) { setStatus('🔑 비밀번호를 입력하세요'); return; }
  stopReading(true);
  const my = session;
  unlockAudio();
  try {
    setStatus('⏳ 연결 확인 중…');
    const url = await fetchAudio('Hello! Shall we read a story together?');
    if (my !== session) return;
    setStatus('✅ 연결 성공!');
    await playUrl(url);
  } catch (e) {
    if (my === session) { setStatus(`⚠️ ${e.message}`); log(`AI 테스트 오류: ${e.message}`); }
  }
});


// =====================================================================
//  E. 사진 → 글자 인식 – PaddleOCR (paddle-ocr.js)
//     ① 글자 줄 위치 찾기 → ② 줄마다 반듯하게 잘라 읽기. 휘거나 기운 책 사진에 강함
// =====================================================================
const $ocrStatus   = document.getElementById('ocrStatus');
const $ocrProgress = document.getElementById('ocrProgress');
const $preview     = document.getElementById('preview');
const $lblCamera   = document.getElementById('lblCamera');
const $lblAlbum    = document.getElementById('lblAlbum');

const MAX_SIDE  = 2000;   // 사진 긴 변을 이 크기로 줄여서 인식 (이보다 크면 느려지기만 함)
const MIN_SCORE = 0.6;    // 이 확신도 미만인 줄은 그림·옆 페이지 조각 등으로 보고 버림
let ocrPromise = null;    // 엔진 준비 (한 번만)
let busy = false;

function setOcrStatus(msg) { $ocrStatus.textContent = msg; }
function setBusy(b) {
  busy = b;
  $lblCamera.classList.toggle('disabled', b);
  $lblAlbum.classList.toggle('disabled', b);
  document.getElementById('btnShot').classList.toggle('disabled', b);
  $ocrProgress.style.display = b ? 'block' : 'none';
}

// 엔진 준비: 페이지를 열자마자 미리 시작 → 첫 사진을 찍을 때쯤엔 대부분 끝나 있음
function getOcr() {
  if (!ocrPromise) {
    ocrPromise = (async () => {
      if (typeof ort === 'undefined') throw new Error('인식 엔진을 불러오지 못했습니다 (인터넷 연결 확인)');
      ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
      ort.env.wasm.numThreads = 1;      // GitHub Pages에서는 다중 스레드를 못 씀
      const t0 = performance.now();
      const mod = await import('./paddle-ocr.js?v=3');
      const ocr = await mod.createOcr(ort, { onProgress: m => { if (!busy) setOcrStatus(m); } });
      log(`OCR 엔진 준비 완료 (${((performance.now() - t0) / 1000).toFixed(1)}초)`);
      if (!busy) setOcrStatus('책 페이지를 찍어 주세요.');
      return { mod, ocr };
    })();
    ocrPromise.catch(e => { ocrPromise = null; log(`OCR 엔진 준비 실패: ${e.message}`); setOcrStatus(`⚠️ ${e.message}`); });
  }
  return ocrPromise;
}

// 사진을 긴 변 2000px로 줄여 픽셀 데이터로 (컬러 그대로 – 이 엔진은 컬러 사진으로 학습됨)
function prepareImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      log(`사진 크기: ${img.naturalWidth}x${img.naturalHeight} → ${canvas.width}x${canvas.height}`);
      resolve(canvas);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 열 수 없습니다')); };
    img.src = url;
  });
}

async function handleFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file || busy) return;
  await recognizeAndRead(() => prepareImage(file));
}

// 공용: 사진(canvas) 준비 → 글자 인식 → 문장 보기 → (기기 음성·Piper면) 바로 읽기
async function recognizeAndRead(getCanvas, { showPreview = true } = {}) {
  stopReading(true);
  setBusy(true);
  $ocrProgress.removeAttribute('value');   // 진행률 대신 "작업 중" 막대
  try {
    setOcrStatus('사진 준비 중…');
    const canvas = await getCanvas();
    if (showPreview) {
      $preview.src = canvas.toDataURL('image/jpeg', 0.7);
      $preview.style.display = 'block';
    }

    setOcrStatus('글자 인식 엔진 준비 중… (처음 한 번만 오래 걸려요)');
    const { mod, ocr } = await getOcr();
    setOcrStatus('글자 읽는 중…');
    await new Promise(r => setTimeout(r, 50));   // 상태 문구가 화면에 그려지도록 잠깐 양보
    const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    const r = await mod.recognize(ocr, data, { minScore: MIN_SCORE });
    const sec = ((r.detMs + r.recMs) / 1000).toFixed(1);

    const text = cleanText(mod.linesToText(r.lines));   // 머리글·쪽번호 제거, 끊긴 줄 합치기
    log(`인식 완료: ${sec}초 (찾기 ${(r.detMs / 1000).toFixed(1)} + 읽기 ${(r.recMs / 1000).toFixed(1)}), ${r.lines.length}줄, ${text.length}자`);
    if (!text) {
      setOcrStatus('😢 글자를 찾지 못했어요. 더 밝고 가까이 다시 찍어 주세요.');
    } else {
      $text.value = text;
      renderSentences();
      if (engine === 'ai') {
        setOcrStatus(`✅ 인식 완료 (${sec}초) – ▶ 읽기를 누르세요`);
      } else {
        // 찍으면 바로 읽기: 사진 버튼을 누를 때 소리 허용을 미리 받아 둠 (primeAutoRead)
        setOcrStatus(`✅ 인식 완료 (${sec}초) – 읽기 시작`);
        log('자동 읽기 시작');
        speakAll();
      }
    }
  } catch (err) {
    setOcrStatus(`⚠️ 오류: ${err.message}`);
    log(`OCR 오류: ${err.message}`);
  } finally {
    setBusy(false);
  }
}

// 찍으면 바로 읽기 (기기 음성 / Piper만):
// iPhone은 화면을 누른 순간에만 소리를 처음 낼 수 있게 허용 → 사진 버튼을 누르는 순간 소리 허용을 받아 둠.
//  - Piper: 재생기(audio)로 아주 짧은 무음 재생  - 기기 음성: 소리 없는 빈 문장 읽기
function primeAutoRead() {
  if (engine === 'piper') {
    unlockAudio();
    preparePiper();
  } else if (engine === 'device' && synth) {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    synth.speak(u);
  }
}
$lblCamera.addEventListener('click', primeAutoRead);
$lblAlbum.addEventListener('click', primeAutoRead);

// ---------------------------------------------------------------------
//  앱 안 카메라 – iPhone 카메라 화면의 "사진 사용" 확인 없이, 버튼 한 번으로 찍고 바로 읽기
// ---------------------------------------------------------------------
const $liveVideo = document.getElementById('liveVideo');
const $liveBox   = document.getElementById('liveBox');
const $btnLiveOn = document.getElementById('btnLiveOn');
let liveStream = null;

async function startLive() {
  primeAutoRead();                       // 버튼 누른 순간 → 소리 허용도 같이 받아 둠
  liveIdleSince = performance.now();
  if (liveStream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setOcrStatus('⚠️ 이 브라우저는 앱 안 카메라를 지원하지 않아요. 📷 사진 찍기를 써 주세요.');
    return;
  }
  try {
    setOcrStatus('카메라 켜는 중…');
    liveStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } },
    });
    $liveVideo.srcObject = liveStream;
    await $liveVideo.play().catch(() => {});
    $liveBox.style.display = 'block';
    $btnLiveOn.style.display = 'none';
    $preview.style.display = 'none';
    const t = liveStream.getVideoTracks()[0];
    const st = t.getSettings ? t.getSettings() : {};
    log(`앱 안 카메라 켬: ${st.width || '?'}x${st.height || '?'}`);
    t.addEventListener('ended', () => stopLive('카메라가 꺼졌어요. 다시 켜 주세요.'));
    setOcrStatus('책 페이지를 화면에 맞추고 📸 찍고 읽기를 누르세요.');
    save('liveCam', '1');
  } catch (e) {
    liveStream = null;
    const why = e.name === 'NotAllowedError' ? '카메라 사용이 허용되지 않았어요. Safari 설정에서 카메라를 허용해 주세요.' : e.message;
    setOcrStatus(`⚠️ ${why}`);
    log(`카메라 오류: ${e.name} ${e.message}`);
  }
}

function stopLive(msg) {
  if (liveStream) liveStream.getTracks().forEach(t => t.stop());
  liveStream = null;
  $liveVideo.srcObject = null;
  $liveBox.style.display = 'none';
  $btnLiveOn.style.display = '';
  if (msg) setOcrStatus(msg);
}

// 지금 카메라 화면을 그대로 한 장으로 캡처 (긴 변 2000px로 줄임)
function grabFrame(quiet = false) {
  const w = $liveVideo.videoWidth, h = $liveVideo.videoHeight;
  if (!w || !h) throw new Error('카메라 화면이 아직 준비되지 않았어요');
  const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext('2d').drawImage($liveVideo, 0, 0, canvas.width, canvas.height);
  if (!quiet) log(`카메라 캡처: ${w}x${h} → ${canvas.width}x${canvas.height}`);
  return canvas;
}

// ---------------------------------------------------------------------
//  페이지 넘김 자동 감지 (카메라 켜져 있고, 지금 페이지를 거의 다 읽었을 때만)
//   화면 변화(움직임)로 판단하면 손에 든 폰이 조금만 흔들려도 헷갈림 → 대신 글자를 직접 확인:
//   약 1초마다 카메라 화면의 글자를 조용히 인식해서, 지금 페이지와 "다른 글"이
//   두 번 연속 똑같이 보이면(= 페이지가 넘어갔고 넘기는 동작도 끝남) 그 글을 바로 읽기.
// ---------------------------------------------------------------------
const $autoTurn = document.getElementById('autoTurn');
$autoTurn.checked = load('autoTurn') !== '0';
$autoTurn.addEventListener('change', () => save('autoTurn', $autoTurn.checked ? '1' : '0'));
let autoChecking = false, autoCandidate = null, autoNextAt = 0, autoLastState = '';
// 배터리·발열 보호: 읽기가 끝난 뒤 10초 동안 새 페이지가 없으면 카메라를 끔
const LIVE_IDLE_MS = 10000;
let liveIdleSince = performance.now();

function isSamePage(a, b) {
  const x = normText(a).slice(0, 80), y = normText(b).slice(0, 80);
  return x.length > 10 && editDistance(x, y, 10) <= 10;
}

setInterval(async () => {
  if (!liveStream) return;
  const now = performance.now();
  if (readingActive || busy) liveIdleSince = now;             // 읽는 중·인식 중엔 쉬는 시간으로 안 셈
  // 아직 한 장도 안 읽었으면(책 맞추는 중) 30초까지 기다려 줌
  else if (now - liveIdleSince > (lastReadIdx >= 0 ? LIVE_IDLE_MS : 30000) && !autoChecking) {
    log('새 페이지가 없어 카메라 끔');
    stopLive('⏸ 10초 동안 새 페이지가 없어 카메라를 껐어요. 🎥 카메라 켜기로 다시 켜 주세요.');
    return;
  }
  if (!$autoTurn.checked || engine === 'ai' || busy || autoChecking) return;
  // 지금 페이지를 거의 다 읽었을 때만 (마지막 2문장째부터, 또는 다 읽은 뒤)
  const nearEnd = sentences.length > 0 && lastReadIdx >= sentences.length - 2;
  if (!nearEnd) { autoCandidate = null; autoLastState = ''; return; }
  if (performance.now() < autoNextAt) return;
  autoChecking = true;
  try {
    const { mod, ocr } = await getOcr();
    const canvas = grabFrame(true);
    const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    const r = await mod.recognize(ocr, data, { minScore: MIN_SCORE });
    const text = cleanText(mod.linesToText(r.lines));
    const isNew = text.length >= 20 && !isSamePage(text, $text.value);
    const state = !isNew ? (text.length < 20 ? '글자 없음' : '같은 페이지') : (autoCandidate && isSamePage(text, autoCandidate) ? '새 페이지 확인' : '새 페이지 후보');
    if (state !== autoLastState) { autoLastState = state; log(`[자동 넘김] ${state} (${text.length}자, ${((r.detMs + r.recMs) / 1000).toFixed(1)}초)`); }
    if (!isNew) { autoCandidate = null; return; }
    if (!autoCandidate || !isSamePage(text, autoCandidate)) { autoCandidate = text; setOcrStatus('📖 새 페이지 확인 중…'); return; }
    // 두 번 연속 같은 새 글 → 새 페이지로 확정
    autoCandidate = null; autoLastState = '';
    while (readingActive) await new Promise(res => setTimeout(res, 200));   // 마지막 문장은 끝까지 읽고
    $text.value = text;
    renderSentences();
    $preview.style.display = 'none';
    setOcrStatus('📖 새 페이지 – 읽기 시작');
    log('자동 넘김: 새 페이지 읽기 시작');
    speakAll();
  } catch (e) {
    log(`[자동 넘김] 오류: ${e.message}`);
  } finally {
    autoChecking = false;
    autoNextAt = performance.now() + 700;
  }
}, 300);

$btnLiveOn.addEventListener('click', startLive);
document.getElementById('btnLiveOff').addEventListener('click', () => { stopLive('책 페이지를 찍어 주세요.'); save('liveCam', '0'); });
document.getElementById('btnShot').addEventListener('click', () => {
  if (busy) return;
  primeAutoRead();                       // 누른 순간 소리 허용
  recognizeAndRead(async () => grabFrame(), { showPreview: false });
});
// 다른 앱에 갔다 오면 iPhone이 카메라를 끄므로, 돌아왔을 때 꺼져 있으면 안내
document.addEventListener('visibilitychange', () => {
  // 화면이 꺼지거나 다른 앱으로 가면 카메라를 바로 끔 (뒤에서 계속 돌며 발열·배터리 소모 방지)
  if (document.visibilityState === 'hidden' && liveStream) { stopLive('카메라를 껐어요. 🎥 카메라 켜기로 다시 켜 주세요.'); return; }
  if (document.visibilityState === 'visible' && liveStream &&
      liveStream.getVideoTracks().every(t => t.readyState === 'ended')) stopLive('카메라가 꺼졌어요. 다시 켜 주세요.');
});

// 지난번에 카메라를 켜 둔 채 썼으면 열자마자 다시 켬 (아이가 버튼을 찾을 필요 없게)
if (load('liveCam') === '1') startLive();

document.getElementById('fileCamera').addEventListener('change', handleFile);
document.getElementById('fileAlbum').addEventListener('change', handleFile);
getOcr();   // 페이지 열자마자 엔진 준비 시작

// =====================================================================
//  G. 단축어에서 넘어온 글 받기
//     주소 끝에 "#t=글"이 붙어 오면 사진 인식을 건너뛰고 그 글로 바로 문장 보기를 만듦
//     (# 뒤 부분은 서버로 전송되지 않아서 글이 길어도 괜찮고, 기기 밖으로 나가지 않음)
// =====================================================================
function receiveFromUrl() {
  const m = location.hash.match(/[#&]t=([^&]*)/);
  if (!m) return false;
  let raw;
  try { raw = decodeURIComponent(m[1].replace(/\+/g, ' ')); }
  catch (e) { log('주소로 받은 글 해석 실패'); return false; }
  // 주소에서 글을 지움 → 새로고침해도 같은 글을 또 받지 않음
  history.replaceState(null, '', location.pathname + location.search);

  raw = raw.replace(/\r\n?/g, '\n');
  const text = cleanText(raw);                 // 머리글·쪽번호 제거 등 기존 정리 그대로 사용
  log(`단축어에서 글 받음: ${raw.length}자 → 정리 후 ${text.length}자`);
  if (!text) { setOcrStatus('😢 받은 글이 비어 있어요. 다시 찍어 주세요.'); return true; }

  $text.value = text;
  renderSentences();
  $preview.style.display = 'none';
  setOcrStatus('✅ 글을 받았어요 – ▶ 읽기를 누르세요');
  setStatus('▶ 읽기를 누르세요');
  window.scrollTo(0, 0);
  return true;
}

renderSentences();   // 처음 예시 글도 문장 보기로 표시
receiveFromUrl();    // 단축어로 열렸으면 받은 글로 바꿈
// 이미 열려 있는 탭에서 주소의 # 부분만 바뀌면 새로 열리지 않으므로 따로 감지
window.addEventListener('hashchange', () => { stopReading(true); receiveFromUrl(); });
</script>
